name: CI

# SPECS, trazabilidad, seed, contrato OpenAPI, build, auditoria de dependencias y deteccion de
# secretos son obligatorios. El E2E (Docker Compose + Playwright) corre sobre etiquetas.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Solo base local del service container. El CI no usa credenciales de Supabase.
      TEST_DATABASE_URL: postgresql://nexo:test@localhost:5432/nexo_test
    steps:
      - uses: actions/checkout@v7

      # La comprobacion de SPECS va justo despues del checkout y nunca despues de exportar.
      - name: SPECS (el JSON coincide con la fuente)
        run: python3 scripts/export_specs.py --check

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run migrate
      - run: npm run test

      # Los seeds versionados coinciden con lo que genera scripts/seed-gen.mjs.
      # DEMO_PASSWORD es la clave FICTICIA de demostracion (la misma de .env.example).
      - name: Seeds al dia
        env:
          DEMO_PASSWORD: Demo-Nexo-2030
        run: npm run seed:check

      # Trazabilidad: modo de ronda intermedia hasta que haya codigo y pruebas (R7 lo vuelve estricto).
      - name: Trazabilidad
        run: python3 scripts/check_trace.py --fase R1

      - name: Contrato OpenAPI
        run: npx --yes @redocly/cli@2.63.0 lint contracts/openapi.yaml

      - name: Compilar API y web
        run: npm run build

      # Alcance: dependencias de todos los workspaces; falla con vulnerabilidades altas o criticas.
      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      # Alcance: el arbol completo en esta ejecucion (sin historial); el historial lo cubre gitleaks
      # al correr con fetch-depth 0 en el job de secretos de abajo.

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Deteccion de secretos (arbol e historial)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --exit-code 1

  e2e:
    # Candidato de entrega: corre sobre etiquetas (baseline-v1, release-examen).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker compose up -d --build --wait db api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - name: Carga (informativa en CI; la medicion de referencia esta en evidence/tests/carga.md)
        env:
          DEMO_PASSWORD: Demo-Nexo-2030
        run: npm run load
        continue-on-error: true
